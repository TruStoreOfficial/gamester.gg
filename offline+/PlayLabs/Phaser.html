<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHASER | PlayLabs</title>
    <style>
        :root { --neon-blue: #00f2ff; --neon-red: #ff0055; --bg-dark: #050505; --grid-color: #1a1a1a; }
        body { background: var(--bg-dark); margin: 0; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
        canvas { display: block; cursor: crosshair; }
        
        /* UI LAYERS */
        .ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(5, 5, 5, 0.9); z-index: 20;
        }
        .hidden { display: none !important; }

        /* TYPOGRAPHY */
        h1 { font-size: clamp(40px, 8vw, 80px); text-shadow: 0 0 20px var(--neon-blue); letter-spacing: 15px; margin-bottom: 10px; }
        .author { font-size: 14px; letter-spacing: 5px; color: rgba(255,255,255,0.5); margin-bottom: 50px; text-transform: uppercase; }

        /* BUTTONS */
        .btn {
            padding: 15px 50px; margin: 10px; background: transparent; 
            border: 2px solid var(--neon-blue); color: var(--neon-blue);
            cursor: pointer; font-family: 'Courier New'; font-weight: bold;
            text-transform: uppercase; letter-spacing: 3px; transition: 0.2s;
            z-index: 30;
        }
        .btn:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 30px var(--neon-blue); }
        
        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 30px; box-sizing: border-box; z-index: 15;
        }
        .stats-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .health-bar { width: 250px; height: 12px; background: rgba(255,0,0,0.1); border: 1px solid var(--neon-red); margin-top: 5px; }
        #health-fill { width: 100%; height: 100%; background: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); transition: width 0.1s; }
        .kill-val { font-size: 40px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        /* VIGNETTE & SCANLINES */
        #scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="scanlines"></div>

<div id="home-screen" class="ui-layer">
    <h1>PHASER</h1>
    <div class="author">By PlayLabs</div>
    <button class="btn" onclick="startPhaser()">Play Simulation</button>
    <button class="btn" onclick="toggleView('settings-screen', true)">Settings</button>
</div>

<div id="settings-screen" class="ui-layer hidden">
    <h1>SETTINGS</h1>
    <div style="margin: 20px; font-size: 18px;">
        <p><input type="checkbox" id="scan-opt" checked onchange="updateFx()"> <label>CRT SCANLINES</label></p>
        <p><input type="checkbox" id="blur-opt" checked> <label>MOTION BLUR</label></p>
    </div>
    <button class="btn" onclick="toggleView('settings-screen', false)">Return</button>
</div>

<div id="hud" class="hidden">
    <div class="stats-row">
        <div>
            <div style="color: var(--neon-red); font-size: 10px; letter-spacing: 2px;">NEURAL LINK STABILITY</div>
            <div class="health-bar"><div id="health-fill"></div></div>
        </div>
        <div style="text-align: right;">
            <div style="color: var(--neon-blue); font-size: 10px; letter-spacing: 2px;">CONFIRMED KILLS</div>
            <div id="k-count" class="kill-val">0</div>
        </div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hFill = document.getElementById('health-fill');
    const kDisplay = document.getElementById('k-count');
    
    let gameState = 'MENU';
    let player = { x: 0, y: 0, r: 12, hp: 100, moving: false };
    let bullets = [], enemies = [], kills = 0, mouse = { x: 0, y: 0 };
    let keys = {};

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    // INPUT HANDLING
    window.onkeydown = e => keys[e.key.toLowerCase()] = true;
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;
    window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = () => { 
        if(gameState === 'PLAYING') {
            bullets.push({ 
                x: player.x, y: player.y, side: 'p', v: 14, 
                angle: Math.atan2(mouse.y - player.y, mouse.x - player.x) 
            });
        }
    };

    // UI CONTROLS
    function toggleView(id, show) {
        document.getElementById(id).classList.toggle('hidden', !show);
        if(!show && id === 'settings-screen') document.getElementById('home-screen').classList.remove('hidden');
    }

    function updateFx() {
        document.getElementById('scanlines').style.display = document.getElementById('scan-opt').checked ? 'block' : 'none';
    }

    function startPhaser() {
        gameState = 'PLAYING';
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        player.hp = 100;
        kills = 0;
        bullets = [];
        enemies = [];
        hFill.style.width = '100%';
        kDisplay.innerText = '0';
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
    }

    function drawGrid() {
        ctx.strokeStyle = '#151515';
        ctx.lineWidth = 1;
        const size = 60;
        for (let x = 0; x <= canvas.width; x += size) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += size) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        player.moving = keys.w || keys.a || keys.s || keys.d;
        let timeScale = player.moving ? 1 : 0.05;

        // Player Move
        let speed = 5;
        if (keys.w && player.y > 0) player.y -= speed;
        if (keys.s && player.y < canvas.height) player.y += speed;
        if (keys.a && player.x > 0) player.x -= speed;
        if (keys.d && player.x < canvas.width) player.x += speed;

        // Enemy Spawning
        if (Math.random() < 0.04) {
            let edge = Math.floor(Math.random() * 4);
            let ex = edge === 0 ? -20 : edge === 1 ? canvas.width + 20 : Math.random() * canvas.width;
            let ey = edge === 2 ? -20 : edge === 3 ? canvas.height + 20 : Math.random() * canvas.height;
            enemies.push({ x: ex, y: ey, lastShot: 0 });
        }

        // Projectile Logic
        bullets.forEach((b, i) => {
            b.x += Math.cos(b.angle) * b.v * timeScale;
            b.y += Math.sin(b.angle) * b.v * timeScale;
            
            if (b.side === 'e' && Math.hypot(player.x - b.x, player.y - b.y) < player.r) {
                player.hp -= 15;
                hFill.style.width = player.hp + '%';
                bullets.splice(i, 1);
                if (player.hp <= 0) {
                    gameState = 'MENU';
                    document.getElementById('hud').classList.add('hidden');
                    document.getElementById('home-screen').classList.remove('hidden');
                }
            }
            if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) bullets.splice(i, 1);
        });

        // Enemy AI
        enemies.forEach((e, i) => {
            let angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(angle) * 2.5 * timeScale;
            e.y += Math.sin(angle) * 2.5 * timeScale;

            if (Date.now() - e.lastShot > 1800 / timeScale) {
                bullets.push({ x: e.x, y: e.y, side: 'e', v: 7, angle: angle });
                e.lastShot = Date.now();
            }

            bullets.forEach((b, bi) => {
                if (b.side === 'p' && Math.hypot(e.x - b.x, e.y - b.y) < 20) {
                    enemies.splice(i, 1);
                    bullets.splice(bi, 1);
                    kills++;
                    kDisplay.innerText = kills;
                }
            });
        });
    }

    function render() {
        const useBlur = document.getElementById('blur-opt').checked;
        ctx.fillStyle = useBlur ? "rgba(5, 5, 5, 0.25)" : "#050505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawGrid();

        if (gameState === 'PLAYING') {
            // Draw Bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.side === 'p' ? '#00f2ff' : '#ff0055';
                ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
                ctx.shadowBlur = 0;
            });

            // Draw Enemies
            enemies.forEach(e => {
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.strokeRect(e.x - 10, e.y - 10, 20, 20);
            });

            // Draw Player
            ctx.fillStyle = '#00f2ff';
            ctx.shadowBlur = 15; ctx.shadowColor = '#00f2ff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
        }

        update();
        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
