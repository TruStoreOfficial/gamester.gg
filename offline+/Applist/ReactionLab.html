<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Lab</title>
    <!-- Load Tailwind CSS for utility classes on UI elements -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Load Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load OrbitControls (matching r128) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        /* Custom Styles */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: #0d0d1a; /* Deep space blue/purple */
            color: #fff;
        }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* FPS Display Styling */
        .score-box {
            font-family: 'Space Mono', monospace;
            background-color: rgba(60, 0, 90, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #c4b5fd;
            box-shadow: 0 0 10px rgba(196, 181, 253, 0.5);
            font-weight: 700;
            color: #c4b5fd;
        }

        /* Generic Button Styling */
        .shape-button {
            background-color: #312e81; /* Indigo-900 */
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid currentColor;
            box-shadow: 0 0 8px currentColor;
            pointer-events: auto;
            white-space: nowrap;
        }
        .shape-button:hover {
            background-color: #4338ca; /* Indigo-800 */
            transform: translateY(-1px);
        }

        .reset-button {
            background-color: #7f1d1d; /* Red-900 */
            color: #fca5a5; /* Red-300 */
            border-color: #fca5a5;
            box-shadow: 0 0 8px #fca5a5;
        }
        .reset-button:hover {
            background-color: #991b1b;
        }

        .text-input, .preset-select {
            background-color: #1f2937;
            border: 1px solid #8b5cf6;
            color: #c4b5fd;
            padding: 0.5rem;
            border-radius: 0.5rem;
            width: 100%;
            max-width: 150px;
            -moz-appearance: none;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c4b5fd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.25em 1.25em;
            padding-right: 2.5rem; /* Make space for dropdown arrow */
        }

        /* Responsive adjustments for controls panel layout */
        #controls-panel {
            min-width: 95%;
            align-items: center;
        }
        @media (min-width: 768px) {
            #controls-panel {
                min-width: 75%;
                max-width: 1000px;
                flex-direction: row;
            }
        }
    </style>
</head>
<body class="bg-gray-900">

    <div id="scene-container">
        <!-- Three.js Canvas will be appended here -->
    </div>

    <!-- Controls Panel for FPS and Dynamic Shape Generation -->
    <div id="controls-panel" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 flex flex-col md:flex-row justify-between items-center space-y-3 md:space-y-0 p-4 rounded-xl bg-gray-800 bg-opacity-90 border border-indigo-500 shadow-2xl">
        
        <!-- FPS DISPLAY -->
        <div id="fpsDisplay" class="score-box text-sm md:text-lg font-mono min-w-[100px] text-center">FPS: Loading</div>
        
        <!-- PRESETS DROPDOWN -->
        <div class="flex flex-col items-center">
            <label for="presetSelect" class="text-xs text-indigo-300 mb-1 font-semibold">PRESET</label>
            <select id="presetSelect" onchange="loadPreset(this.value)" class="preset-select text-xs md:text-sm">
                <option value="normal">Normal</option>
                <option value="empty">Empty</option>
                <option value="letters">Letters (A-Z)</option>
                <option value="numbers">Numbers (0-9)</option>
            </select>
        </div>

        <!-- SHAPE BUTTONS -->
        <div class="flex flex-wrap justify-center gap-2 md:gap-3">
            <button onclick="addAnimatedShape('dodecahedron')" class="shape-button text-purple-300" style="border-color:#d8b4fe; box-shadow: 0 0 8px #d8b4fe;">Dodecahedron</button>
            <button onclick="addAnimatedShape('pyramid')" class="shape-button text-red-300" style="border-color:#fca5a5; box-shadow: 0 0 8px #fca5a5;">Pyramid</button>
            <button onclick="addAnimatedShape('cube')" class="shape-button text-green-300" style="border-color:#86efac; box-shadow: 0 0 8px #86efac;">Cube</button>
            <button onclick="addAnimatedShape('cylinder')" class="shape-button text-blue-300" style="border-color:#93c5fd; box-shadow: 0 0 8px #93c5fd;">Cylinder</button>
            <button onclick="addAnimatedShape('sphere')" class="shape-button text-cyan-300" style="border-color:#67e8f9; box-shadow: 0 0 8px #67e8f9;">Sphere</button>
            <button onclick="addAnimatedShape('house')" class="shape-button text-orange-300" style="border-color:#fdbf6f; box-shadow: 0 0 8px #fdbf6f;">House</button>
        </div>

        <!-- TEXT INPUT & BUTTON -->
        <div class="flex flex-col space-y-2 md:space-y-0 md:flex-row gap-2 items-center">
            <input type="text" id="textInput" value="VR Test" maxlength="10" placeholder="Custom Text (Max 10)" class="text-input text-xs md:text-sm">
            <button onclick="addAnimatedShape('text')" id="addTextButton" class="shape-button text-yellow-300" style="border-color:#fde047; box-shadow: 0 0 8px #fde047; opacity: 0.5;" disabled>Add Text</button>
        </div>

        <!-- RESET BUTTON -->
        <button onclick="resetScene()" class="shape-button reset-button">Reset Scene</button>
    </div>

    <script>
        // --- Firebase Globals (Standard Canvas Environment Setup - Not used for this demo) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let scene, camera, renderer, controls;
        let animatedObjects = []; // Array to hold all animated objects
        
        // --- Pre-create materials for the 'house' shape to reuse
        const houseBaseMaterial = new THREE.MeshPhongMaterial({
            color: 0x8B4513, // Brown
            emissive: 0x8B4513, emissiveIntensity: 0.4,
            specular: 0xffffff, shininess: 30
        });
        const houseRoofMaterial = new THREE.MeshPhongMaterial({
            color: 0xB22222, // Firebrick Red
            emissive: 0xB22222, emissiveIntensity: 0.6,
            specular: 0xffffff, shininess: 30
        });
        
        // --- Font Loading for 3D Text ---
        // Note: THREE.FontLoader is available via the main three.min.js in r128
        const fontLoader = new THREE.FontLoader();
        let loadedFont = null;
        const addTextButton = document.getElementById('addTextButton');

        const container = document.getElementById('scene-container');
        const fpsDisplay = document.getElementById('fpsDisplay');

        // --- FPS Tracking Variables ---
        let lastTime = 0;
        let fpsCounter = 0;
        const FPS_UPDATE_INTERVAL = 10; // Update FPS display every 10 frames

        /**
         * Initializes the Three.js scene, camera, and renderer.
         */
        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0d1a, 0.005);

            // 2. Camera Setup
            const fov = 75;
            const aspect = window.innerWidth / window.innerHeight;
            const near = 0.1;
            const far = 1000;
            camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
            camera.position.z = 15;
            camera.position.y = 5;

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x8b5cf6, 1.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // 5. Controls
            // Note: THREE.OrbitControls is loaded from the separate script tag
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 5;
            controls.maxDistance = 50;

            // 6. Add Initial Geometry
            createGround();
            createStars(5000);
            
            // 7. Load Font for Text Geometry
            loadFont();
            
            // 8. Load the default preset
            loadPreset('normal');
            
            // Start event listeners and animation loop
            window.addEventListener('resize', onWindowResize, false);
            animate(0);
        }

        /**
         * Asynchronously loads the typeface JSON required for 3D text generation.
         */
        function loadFont() {
            fontLoader.load(
                // Public CDN link for a basic Three.js font
                'https://threejs.org/examples/fonts/gentilis_regular.typeface.json',
                function (font) {
                    loadedFont = font;
                    console.log("3D Font asset loaded successfully.");
                    // Enable the text button and remove opacity once loaded
                    addTextButton.disabled = false;
                    addTextButton.style.opacity = 1.0;
                    addTextButton.textContent = 'Add Text';
                    
                    // If a preset was waiting for the font, load it now.
                    const presetSelect = document.getElementById('presetSelect');
                    if (presetSelect.value === 'letters' || presetSelect.value === 'numbers') {
                        loadPreset(presetSelect.value);
                    }
                },
                undefined, // onProgress
                function (error) {
                    console.error('Error loading 3D font:', error);
                    addTextButton.textContent = 'Font Error';
                }
            );
        }

        /**
         * Creates a large grid plane and the background stars.
         */
        function createGround() {
            const size = 100;
            const divisions = 100;
            const gridHelper = new THREE.GridHelper(size, divisions, 0x5a32a8, 0x5a32a8);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
        }
        
        function createStars(count) {
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff, size: 0.1, sizeAttenuation: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8
            });
            const starVertices = [];
            for (let i = 0; i < count; i++) {
                const x = (Math.random() - 0.5) * 200;
                const y = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;
                starVertices.push(x, y, z);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }


        /**
         * Creates and adds a new animated shape to the scene.
         * @param {string} type - The type of geometry ('cube', 'pyramid', 'text', etc.).
         * @param {boolean} [checkFont=true] - Whether to check if the font is loaded (for text).
         * @param {string|null} [textContentOverride=null] - Optional text content for text shapes.
         */
        function addAnimatedShape(type, checkFont = true, textContentOverride = null) {
            let geometry;
            let material; // Use 'material' instead of 'color' to support groups
            let mesh; // This can be a Mesh or a Group
            let size = 1.5 + Math.random() * 0.5; // Slightly varying size

            switch (type) {
                case 'dodecahedron':
                    geometry = new THREE.DodecahedronGeometry(size, 0);
                    material = new THREE.MeshPhongMaterial({
                        color: 0xd8b4fe, emissive: 0xd8b4fe, emissiveIntensity: 0.7,
                        specular: 0xffffff, shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    break;
                case 'pyramid':
                    // ConeGeometry with 4 sides for a square pyramid
                    geometry = new THREE.ConeGeometry(size, size * 1.5, 4);
                    material = new THREE.MeshPhongMaterial({
                        color: 0xfca5a5, emissive: 0xfca5a5, emissiveIntensity: 0.7,
                        specular: 0xffffff, shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    break;
                case 'cube':
                    geometry = new THREE.BoxGeometry(size, size, size);
                    material = new THREE.MeshPhongMaterial({
                        color: 0x86efac, emissive: 0x86efac, emissiveIntensity: 0.7,
                        specular: 0xffffff, shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(size * 0.5, size * 0.5, size * 1.5, 32);
                    material = new THREE.MeshPhongMaterial({
                        color: 0x93c5fd, emissive: 0x93c5fd, emissiveIntensity: 0.7,
                        specular: 0xffffff, shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    break;
                case 'sphere':
                    geometry = new THREE.SphereGeometry(size, 16, 16);
                    material = new THREE.MeshPhongMaterial({
                        color: 0x67e8f9, emissive: 0x67e8f9, emissiveIntensity: 0.7,
                        specular: 0xffffff, shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    break;
                case 'house':
                    mesh = new THREE.Group();
                    const baseSize = size * 1.2;
                    const roofHeight = size * 1.0;
                    
                    // Base
                    const baseGeo = new THREE.BoxGeometry(baseSize, baseSize, baseSize);
                    const baseMesh = new THREE.Mesh(baseGeo, houseBaseMaterial);
                    mesh.add(baseMesh);
                    
                    // Roof
                    const roofGeo = new THREE.ConeGeometry(baseSize * 0.8, roofHeight, 4);
                    const roofMesh = new THREE.Mesh(roofGeo, houseRoofMaterial);
                    roofMesh.position.y = (baseSize / 2) + (roofHeight / 2); // Position roof on top of base
                    roofMesh.rotation.y = Math.PI / 4; // Align roof edges with base
                    mesh.add(roofMesh);
                    
                    break; // Material is already set (group has no material)
                case 'text':
                    if (checkFont && !loadedFont) {
                        console.warn("Font not yet loaded for 3D text.");
                        // Handle user feedback better than just logging
                        addTextButton.textContent = 'Loading...';
                        setTimeout(() => {
                            if (addTextButton.textContent === 'Loading...') {
                                addTextButton.textContent = 'Add Text';
                            }
                        }, 1000);
                        return;
                    }
                    const textContent = textContentOverride !== null ? textContentOverride : (document.getElementById('textInput').value || "VR Test");
                    geometry = new THREE.TextGeometry(textContent, {
                        font: loadedFont,
                        size: 2,
                        height: 0.5,
                        curveSegments: 12,
                        bevelEnabled: true,
                        bevelThickness: 0.05,
                        bevelSize: 0.02,
                        bevelOffset: 0,
                        bevelSegments: 5
                    });
                    // Center the text geometry after creation
                    geometry.computeBoundingBox();
                    const textWidth = geometry.boundingBox.max.x - geometry.boundingBox.min.x;
                    geometry.translate(-0.5 * textWidth, 0, 0); 
                    
                    material = new THREE.MeshPhongMaterial({
                        color: 0xfde047, emissive: 0xfde047, emissiveIntensity: 0.7,
                        specular: 0xffffff, shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    break;
                default:
                    return;
            }

            // Note: 'mesh' can now be a THREE.Mesh or THREE.Group
            
            // Random placement within bounds, floating above the ground
            mesh.position.set(
                (Math.random() - 0.5) * 40,
                Math.random() * 8 + 2, // Between 2 and 10 units up
                (Math.random() - 0.5) * 40
            );

            // Store animation data
            mesh.userData.initialY = mesh.position.y;
            // Dodecahedrons and Text rotate slower for visual clarity
            mesh.userData.rotationSpeed = type === 'text' || type === 'dodecahedron' ? (Math.random() * 0.005 + 0.001) : (Math.random() * 0.01 + 0.005);
            
            scene.add(mesh);
            animatedObjects.push(mesh);
        }

        /**
         * Clears all dynamically added shapes from the scene.
         */
        function clearScene() {
            if (!scene) return;
            
            // Dispose of geometry and material to free up GPU memory
            animatedObjects.forEach(mesh => {
                scene.remove(mesh);
                
                // Handle Groups vs Meshes
                if (mesh.isGroup) {
                    mesh.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        // Materials are reused, so we don't dispose them here.
                        // If they weren't reused, we would dispose:
                        // if (child.material) child.material.dispose();
                    });
                } else {
                    // Handle single Mesh
                    if (mesh.geometry) mesh.geometry.dispose();
                    if (mesh.material) mesh.material.dispose();
                }
            });
            animatedObjects = [];
        }

        /**
         * Loads a specific preset scene configuration.
         * @param {string} presetName - The name of the preset to load.
         * @param {boolean} [isReset=false] - If true, updates the dropdown to 'normal'.
         */
        function loadPreset(presetName, isReset = false) {
            if (isReset) {
                // If reset button was clicked, set dropdown back to normal
                document.getElementById('presetSelect').value = 'normal';
            }
            
            // Clear all existing shapes
            clearScene();
            
            // Check if font is needed but not loaded
            if ((presetName === 'letters' || presetName === 'numbers') && !loadedFont) {
                console.warn(`Font not loaded, cannot display ${presetName} preset yet.`);
                addTextButton.textContent = 'Loading Font...';
                addTextButton.style.opacity = 0.5;
                addTextButton.disabled = true;
                return;
            }

            // Load new shapes based on preset
            switch (presetName) {
                case 'normal':
                    // Add the initial set of objects back
                    for (let i = 0; i < 15; i++) {
                        const types = ['dodecahedron', 'cube', 'cylinder'];
                        const type = types[i % types.length];
                        addAnimatedShape(type, false);
                    }
                    break;
                
                case 'empty':
                    // Do nothing, scene is already clear
                    break;
                    
                case 'letters':
                    // Loop from 'A' (65) to 'Z' (90)
                    for (let i = 65; i <= 90; i++) {
                        const char = String.fromCharCode(i);
                        addAnimatedShape('text', false, char);
                    }
                    break;
                    
                case 'numbers':
                    // Loop from '0' (48) to '9' (57)
                    for (let i = 48; i <= 57; i++) {
                        const char = String.fromCharCode(i);
                        addAnimatedShape('text', false, char);
                    }
                    break;
            }
        }
        
        /**
         * Resets the scene to the default preset.
         */
        function resetScene() {
            loadPreset('normal', true);
        }

        /**
         * Calculates and updates the Frames Per Second display.
         * @param {number} now - The current timestamp from requestAnimationFrame.
         */
        function updateFPS(now) {
            if (lastTime === 0) {
                lastTime = now;
            }
            const delta = now - lastTime;
            lastTime = now;
            // Calculate instantaneous FPS: 1000ms / delta_time_in_ms
            const fps = Math.round(1000 / delta);

            // Update display only every X frames to avoid excessive DOM manipulation
            if (fpsCounter % FPS_UPDATE_INTERVAL === 0) {
                fpsDisplay.textContent = `FPS: ${fps}`;
            }
            fpsCounter++;
        }


        /**
         * Handles window resizing to maintain responsiveness.
         */
        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * The main animation loop for rendering and updating controls/objects.
         * @param {number} now - The high-resolution timestamp (ms) since the page loaded.
         */
        function animate(now) {
            requestAnimationFrame(animate);

            // 1. Update FPS counter
            updateFPS(now);

            // 2. Update controls
            if (controls) controls.update();

            // 3. Animate all objects
            const time = performance.now() * 0.001; // Time in seconds
            animatedObjects.forEach((mesh, index) => {
                // Rotation
                mesh.rotation.x += mesh.userData.rotationSpeed;
                mesh.rotation.y += mesh.userData.rotationSpeed * 1.5;

                // Floating movement using sine waves
                mesh.position.y = mesh.userData.initialY + Math.sin(time * 0.5 + index) * 1.0;
            });

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Start the application when the window loads
        window.onload = init;
    </script>
</body>
</html>
