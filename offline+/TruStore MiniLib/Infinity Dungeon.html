<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Infinity Labyrinth</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }
    canvas#labyrinth {
      display: block;
      margin: auto;
      background: #222; /* Default, will be overridden by room color */
    }
    canvas#minimap {
      position: absolute;
      top: 20px;
      right: 20px;
      border: 2px solid #555;
      z-index: 10;
    }
    #backpack {
      position: absolute;
      top: 80px;
      right: 20px;
      width: 200px;
      height: 340px;
      background: rgba(0,0,0,0.85);
      border: 2px solid #666;
      padding: 10px;
      display: none;
      z-index: 10;
    }
    #inventory {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #inventory li {
      padding: 2px 0;
      cursor: pointer;
    }
    #inventory li:hover {
      background-color: #555;
    }
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border: 2px solid #666;
      z-index: 10;
    }
    .hotbar-slot {
      width: 50px;
      height: 50px;
      border: 2px solid #888;
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      position: relative;
    }
    .hotbar-slot.active {
        border-color: yellow;
    }
    .hotbar-slot span {
        position: absolute;
        bottom: 2px;
        right: 2px;
        font-size: 10px;
        color: #ddd;
    }
    #dialogue-box {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        background: rgba(0,0,0,0.85);
        border: 2px solid #666;
        padding: 10px;
        display: none;
        z-index: 20;
    }
    #health-display {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0,0,0,0.7);
        padding: 10px;
        border: 2px solid #666;
        color: #fff;
        z-index: 10;
    }
    #game-over-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        color: red;
        display: none;
        justify-content: center;
        align-items: center;
        font-size: 4em;
        flex-direction: column;
        z-index: 100;
    }
    #game-over-screen button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 0.5em;
        cursor: pointer;
    }
    #copyright {
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7em;
        color: #777;
        z-index: 5; /* Below other UI elements */
    }
  </style>
</head>
<body>

<canvas id="labyrinth" width="800" height="600"></canvas>

<canvas id="minimap" width="200" height="150"></canvas>

<div id="backpack">
  <h3>[=] Backpack</h3>
  <ul id="inventory"></ul>
</div>

<div id="hotbar"></div>

<div id="dialogue-box">
    <p id="dialogue-text"></p>
    <button id="dialogue-close">Close</button>
</div>

<div id="health-display">
    Health: <span id="player-health-value">100</span>
</div>

<div id="game-over-screen">
    <p>GAME OVER</p>
    <button id="restart-button">Restart</button>
</div>

<script>
window.onload = () => {
  // 🎮 Get all game elements
  const canvas = document.getElementById("labyrinth");
  const ctx = canvas.getContext("2d");
  const minimapCanvas = document.getElementById("minimap");
  const minimapCtx = minimapCanvas.getContext("2d");
  const backpackUI = document.getElementById("backpack");
  const inventoryList = document.getElementById("inventory");
  const hotbarUI = document.getElementById("hotbar");
  const dialogueBox = document.getElementById("dialogue-box");
  const dialogueText = document.getElementById("dialogue-text");
  const dialogueCloseButton = document.getElementById("dialogue-close");
  const healthDisplay = document.getElementById("player-health-value");
  const gameOverScreen = document.getElementById("game-over-screen");
  const restartButton = document.getElementById("restart-button");

  // 📦 Define game constants
  const mapWidth = 20, mapHeight = 15, tileSize = 40;
  let player = { x: 10, y: 7 };
  let currentRoom = { x: 0, y: 0 };
  let currentLevel = 1; // Start at level 1
  let roomMaps = {}; // Stores maps for each room at each level
  let playerInventory = [];
  let hotbar = Array(5).fill(null); // 5 slots in the hotbar
  let activeHotbarSlot = 0;
  let backpackOpen = false;
  let playerHealth = 100;
  let gameActive = true;
  const fogColor = "rgba(0, 0, 0, 0.9)"; // Dark, semi-transparent color for fog
  const sightRadius = 2; // How many tiles around the player are visible

  const itemPool = ["Potion", "Map Fragment", "Crystal Banana", "Rusty Dagger", "Goblin Snacks"];
  const asciiFaces = { // These are still here for dialogue, but not for drawing
    waifu: ["(♥ω♥*)", "(≧◡≦)", "／人◕ ‿‿ ◕人＼"],
    normal: ["(ᵔᴥᵔ)", "ʕ•ᴥ•ʔ", "⊂(◉‿◉)つ"],
    lost: ["(◎_◎;)", "(•́へ•́╬)", "(⊙_☉)"],
    special: ["༼ つ ◕_◕ ༽つ", "⚆ _ ⚆", "✪ ω ✪"]
  };
  const dialogLines = {
    waifu: ["I haven't seen you before!", "I-I made this for you...!"],
    normal: ["They nod politely.", "'Stay safe in the shadows.'"],
    lost: ["'I lost my map!'", "'This room looks familiar...'"],
    special: ["'The veil is thin here.'", "'You are not ordinary.'"]
  };

  // Define colors for person variants
  const personColors = {
      normal: "yellow",
      special: "lightblue",
      trader: "orange",
      waifu: "pink",
      attacker: "red",
      lost: "grey"
  };

  const baseRoomColors = [
    "#F0F8FF", // AliceBlue - light and cool
    "#F5DEB3", // Wheat - warm and inviting
    "#D8BFD8", // Thistle - soft purple
    "#ADD8E6", // LightBlue - bright sky
    "#FFFACD", // LemonChiffon - very light yellow
    "#98FB98", // PaleGreen - gentle green
    "#FFB6C1", // LightPink - playful
    "#A9A9A9"  // DarkGray - neutral
  ];

  // Utility function to darken a hex color by a percentage
  function darkenColor(hex, percent) {
    let r = parseInt(hex.substring(1, 3), 16);
    let g = parseInt(hex.substring(3, 5), 16);
    let b = parseInt(hex.substring(5, 7), 16);

    r = Math.floor(r * (100 - percent) / 100);
    g = Math.floor(g * (100 - percent) / 100);
    b = Math.floor(b * (100 - percent) / 100);

    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));

    const toHex = (c) => ("0" + c.toString(16)).slice(-2);
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }

  // 🧱 Generate random map tiles and entities for a room
  function generateRoom(x, y, level) {
    const key = `${level},${x},${y}`;
    const tiles = Array.from({ length: mapHeight }, () =>
      Array.from({ length: mapWidth }, () => Math.random() > 0.2 ? 1 : 0)
    );
    // Initialize explored status for each tile in this new room to false
    const explored = Array.from({ length: mapHeight }, () =>
      Array.from({ length: mapWidth }, () => false)
    );

    const entities = [];

    // Place a random item (25% chance)
    if (Math.random() < 0.25) {
      const item = itemPool[Math.floor(Math.random() * itemPool.length)];
      placeEntity(tiles, entities, "Item", item);
    }

    // Place a random person (15% chance)
    if (Math.random() < 0.15) {
      const types = ["waifu", "normal", "lost", "special"];
      const variant = types[Math.floor(Math.random() * types.length)];
      placeEntity(tiles, entities, "Person", variant);
    }

    // Place a trap (10% chance)
    if (Math.random() < 0.10 && level > 1) { // Traps appear from level 2 onwards
        placeEntity(tiles, entities, "Trap", "Spikes");
    }

    // Place stairs down (only if not at max level for now, or last room of a "floor")
    // For simplicity, let's place stairs in the center of the initial room of each level
    // A more complex game would place them after certain conditions are met
    // Ensure stairs are not placed on the player's initial spawn point.
    if (x === 0 && y === 0 && level < baseRoomColors.length) { // Place stairs in the starting room of new levels
        placeEntity(tiles, entities, "Stairs", "down");
    }

    const floorColor = baseRoomColors[(level - 1) % baseRoomColors.length]; // Cycle through base colors for floor
    const wallColor = darkenColor(floorColor, 60); // Walls are 60% darker than floor

    roomMaps[key] = { tiles, entities, floorColor, wallColor, explored }; // Store explored status
  }

  // Helper to place entities on open tiles
  function placeEntity(tiles, entities, type, variant) {
    for (let i = 0; i < 50; i++) { // Try up to 50 times to find a spot
      const x = Math.floor(Math.random() * mapWidth);
      const y = Math.floor(Math.random() * mapHeight);
      // Ensure the tile is walkable and not already occupied by another entity or the player's initial spot
      if (tiles[y][x] && !(x === player.x && y === player.y) && !entities.some(e => e.x === x && e.y === y)) {
        entities.push({ type, x, y, variant });
        return true; // Entity successfully placed
      }
    }
    return false; // Could not find a spot
  }

  // 🗺️ Get map data or create if missing
  function getCurrentMap() {
    const key = `${currentLevel},${currentRoom.x},${currentRoom.y}`;
    if (!roomMaps[key]) generateRoom(currentRoom.x, currentRoom.y, currentLevel);
    return roomMaps[key];
  }

  // Reveal areas around the player (fog of war)
  function applyFog() {
      const { explored } = getCurrentMap();
      for (let dy = -sightRadius; dy <= sightRadius; dy++) {
          for (let dx = -sightRadius; dx <= sightRadius; dx++) {
              const checkX = player.x + dx;
              const checkY = player.y + dy;

              // Check boundaries and mark as explored
              if (checkX >= 0 && checkX < mapWidth && checkY >= 0 && checkY < mapHeight) {
                  explored[checkY][checkX] = true;
              }
          }
      }
  }


  // 🎨 Draw the maze, player, and entities
  function drawMap() {
    if (!gameActive) return;

    const { tiles, entities, floorColor, wallColor, explored } = getCurrentMap();
    canvas.style.background = wallColor; // Set canvas background to wall color
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw tiles
    for (let y = 0; y < mapHeight; y++) {
      for (let x = 0; x < mapWidth; x++) {
        if (explored[y][x]) { // Only draw if explored
            ctx.fillStyle = tiles[y][x] ? floorColor : wallColor; // Use dynamic floor and wall colors
        } else {
            ctx.fillStyle = fogColor; // Covered by fog
        }
        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
      }
    }

    // Draw entities (only if within explored area)
    entities.forEach(entity => {
      if (explored[entity.y][entity.x]) { // Only draw entity if its tile is explored
          const blockWidth = tileSize * 0.5;
          const blockHeight = tileSize * 0.5;
          const offsetX = (tileSize - blockWidth) / 2;
          const offsetY = (tileSize - blockHeight) / 2;

          if (entity.type === "Item") {
            ctx.fillStyle = "gold";
            ctx.font = `${tileSize * 0.7}px monospace`;
            ctx.fillText("⭐", entity.x * tileSize + tileSize / 8, entity.y * tileSize + tileSize * 0.8);
          } else if (entity.type === "Person") {
            ctx.fillStyle = personColors[entity.variant] || "white";
            ctx.fillRect(
                entity.x * tileSize + offsetX,
                entity.y * tileSize + offsetY,
                blockWidth,
                blockHeight
            );
          } else if (entity.type === "Trap") {
              ctx.fillStyle = "red";
              ctx.font = `${tileSize * 0.7}px monospace`;
              ctx.fillText("▲", entity.x * tileSize + tileSize / 8, entity.y * tileSize + tileSize * 0.8);
          } else if (entity.type === "Stairs") {
              ctx.fillStyle = "blue";
              ctx.font = `${tileSize * 0.7}px monospace`;
              ctx.fillText("▼", entity.x * tileSize + tileSize / 8, entity.y * tileSize + tileSize * 0.8);
          }
      }
    });

    // Draw player (always visible)
    ctx.fillStyle = "lime";
    ctx.fillRect(player.x * tileSize, player.y * tileSize, tileSize, tileSize);

    drawMinimap(); // Update minimap after drawing main map
    updateHealthDisplay(); // Update health display
  }

  // 🗺️ Draw the minimap
  function drawMinimap() {
    const { tiles, explored } = getCurrentMap();
    minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    const miniTileSizeX = minimapCanvas.width / mapWidth;
    const miniTileSizeY = minimapCanvas.height / mapHeight;

    for (let y = 0; y < mapHeight; y++) {
      for (let x = 0; x < mapWidth; x++) {
        if (explored[y][x]) { // Only draw on minimap if explored
            minimapCtx.fillStyle = tiles[y][x] ? "#888" : "#444"; // Walkable or Wall
        } else {
            minimapCtx.fillStyle = "#111"; // Unexplored areas are very dark on minimap
        }
        minimapCtx.fillRect(x * miniTileSizeX, y * miniTileSizeY, miniTileSizeX, miniTileSizeY);
      }
    }

    // Draw player on minimap
    minimapCtx.fillStyle = "cyan";
    minimapCtx.fillRect(player.x * miniTileSizeX, player.y * miniTileSizeY, miniTileSizeX, miniTileSizeY);
  }

  // 🚶 Move player and handle room transitions
  function movePlayer(dx, dy) {
    if (!gameActive) return;

    const newX = player.x + dx;
    const newY = player.y + dy;
    const map = getCurrentMap().tiles;

    let roomChanged = false;

    // Check for room transitions
    if (newX < 0) {
      currentRoom.x--;
      player.x = mapWidth - 1;
      roomChanged = true;
    } else if (newX >= mapWidth) {
      currentRoom.x++;
      player.x = 0;
      roomChanged = true;
    } else if (newY < 0) {
      currentRoom.y--;
      player.y = mapHeight - 1;
      roomChanged = true;
    } else if (newY >= mapHeight) {
      currentRoom.y++;
      player.y = 0;
      roomChanged = true;
    } else if (map[newY][newX]) { // Check if the new tile is walkable
      player.x = newX;
      player.y = newY;
    } else {
        return; // Don't redraw if player hit a wall
    }

    applyFog(); // Apply fog logic after every move
    handleInteractions(); // Check for interactions after moving
    drawMap(); // Redraw map after player movement or room change
  }

  // 🎒 Update Backpack UI
  function updateBackpackUI() {
    inventoryList.innerHTML = '';
    if (playerInventory.length === 0) {
      inventoryList.innerHTML = '<li>Empty</li>';
    } else {
      playerInventory.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = item;
        li.onclick = () => addItemToHotbar(item, index);
        inventoryList.appendChild(li);
      });
    }
  }

  // 🔢 Update Hotbar UI
  function updateHotbarUI() {
    hotbarUI.innerHTML = '';
    for (let i = 0; i < hotbar.length; i++) {
      const slot = document.createElement('div');
      slot.classList.add('hotbar-slot');
      if (i === activeHotbarSlot) {
          slot.classList.add('active');
      }
      slot.textContent = hotbar[i] ? hotbar[i].substring(0, 10) : ''; // Display first 10 chars of item name
      slot.setAttribute('data-slot-index', i);
      slot.onclick = () => activateHotbarSlot(i);

      if (hotbar[i]) {
          const removeBtn = document.createElement('span');
          removeBtn.textContent = 'x';
          removeBtn.style.cursor = 'pointer';
          removeBtn.onclick = (e) => {
              e.stopPropagation(); // Prevent slot activation
              removeItemFromHotbar(i);
          };
          slot.appendChild(removeBtn);
      }
      hotbarUI.appendChild(slot);
    }
  }

  // Add item from inventory to hotbar
  function addItemToHotbar(item, inventoryIndex) {
      const emptySlotIndex = hotbar.findIndex(slot => slot === null);
      if (emptySlotIndex !== -1) {
          hotbar[emptySlotIndex] = item;
          playerInventory.splice(inventoryIndex, 1); // Remove from inventory
          updateBackpackUI();
          updateHotbarUI();
      } else {
          showDialogue("Hotbar is full! Remove an item first.");
      }
  }

  // Remove item from hotbar back to inventory
  function removeItemFromHotbar(slotIndex) {
      const item = hotbar[slotIndex];
      if (item) {
          playerInventory.push(item); // Add back to inventory
          hotbar[slotIndex] = null;
          updateBackpackUI();
          updateHotbarUI();
      }
  }

  // Activate a hotbar slot
  function activateHotbarSlot(index) {
      activeHotbarSlot = index;
      updateHotbarUI();
      // Logic for using the item could go here
      const item = hotbar[activeHotbarSlot];
      if (item) {
          showDialogue(`You are now holding: ${item}`);
          // Add specific item usage logic here, e.g., if item is "Potion", usePotion()
          if (item === "Potion") {
              usePotion();
              hotbar[activeHotbarSlot] = null; // Consume potion
              updateHotbarUI();
          }
      } else {
          showDialogue("This hotbar slot is empty.");
      }
  }

  // Function to use a potion
  function usePotion() {
      playerHealth = Math.min(100, playerHealth + 20); // Heal 20 HP, max 100
      updateHealthDisplay();
      showDialogue("You used a Potion and restored 20 HP!");
  }


  // Handle interactions with entities
  function handleInteractions() {
    const currentMap = getCurrentMap();
    const entities = currentMap.entities; // Get a reference to the actual array

    for (let i = 0; i < entities.length; i++) {
      const entity = entities[i];
      if (entity.x === player.x && entity.y === player.y) {
        if (entity.type === "Item") {
          playerInventory.push(entity.variant);
          showDialogue(`Picked up: ${entity.variant}`);
          entities.splice(i, 1); // Remove item from map
          updateBackpackUI();
          break; // Only interact with one entity per step
        } else if (entity.type === "Person") {
          const randomDialogue = dialogLines[entity.variant][Math.floor(Math.random() * dialogLines[entity.variant].length)];
          const randomFace = asciiFaces[entity.variant] ? asciiFaces[entity.variant][Math.floor(Math.random() * asciiFaces[entity.variant].length)] : ""; // Use ASCII face for dialogue
          showDialogue(`${randomFace} ${randomDialogue}`);
          // Persons are not removed after interaction
          break;
        } else if (entity.type === "Trap") {
            playerHealth -= 10; // Lose 10 health
            showDialogue("You stepped on a trap! -10 HP!");
            entities.splice(i, 1); // Remove trap after activation
            updateHealthDisplay();
            checkGameOver();
            break;
        } else if (entity.type === "Stairs") {
            currentLevel++;
            currentRoom = { x: 0, y: 0 }; // Reset room coordinates for the new level
            player = { x: 10, y: 7 }; // Reset player position
            showDialogue(`You found stairs and descended to Level ${currentLevel}!`);
            // Stairs are typically not removed, or removed based on game design
            // For now, they remain for clarity.
            break;
        }
      }
    }
  }

  // Update health display
  function updateHealthDisplay() {
      healthDisplay.textContent = playerHealth;
  }

  // Check for game over
  function checkGameOver() {
      if (playerHealth <= 0) {
          playerHealth = 0; // Ensure health doesn't go negative on display
          updateHealthDisplay();
          gameActive = false;
          gameOverScreen.style.display = 'flex';
          showDialogue("Your adventure ends here."); // Final dialogue
      }
  }

  // Restart game
  restartButton.onclick = () => {
      player = { x: 10, y: 7 };
      currentRoom = { x: 0, y: 0 };
      currentLevel = 1;
      roomMaps = {}; // Clear all generated rooms
      playerInventory = [];
      hotbar = Array(5).fill(null);
      activeHotbarSlot = 0;
      backpackOpen = false;
      playerHealth = 100;
      gameActive = true;
      gameOverScreen.style.display = 'none';
      dialogueBox.style.display = 'none'; // Ensure dialogue box is hidden
      updateBackpackUI();
      updateHotbarUI();
      applyFog(); // Apply fog on restart
      drawMap(); // Redraw initial map
  };

  // Show dialogue box
  function showDialogue(message) {
      dialogueText.textContent = message;
      dialogueBox.style.display = 'block';
  }

  // Hide dialogue box
  dialogueCloseButton.onclick = () => {
      dialogueBox.style.display = 'none';
  };

  // 🎮 WASD and other controls
  document.addEventListener("keydown", e => {
    if (!gameActive) { // Prevent input if game is over
        if (e.key === "Enter" && gameOverScreen.style.display === 'flex') {
            restartButton.click(); // Allow restarting with Enter
        }
        return;
    }

    if (dialogueBox.style.display === 'block') {
        // If dialogue is open, only allow closing it
        if (e.key === "Escape" || e.key === "Enter") {
            dialogueBox.style.display = 'none';
        }
        return;
    }

    if (e.key === "w") movePlayer(0, -1);
    else if (e.key === "s") movePlayer(0, 1);
    else if (e.key === "a") movePlayer(-1, 0);
    else if (e.key === "d") movePlayer(1, 0);
    else if (e.key === "e") { // Toggle backpack with 'e'
        backpackOpen = !backpackOpen;
        backpackUI.style.display = backpackOpen ? 'block' : 'none';
        if (backpackOpen) {
            updateBackpackUI(); // Refresh inventory when opening
        }
    } else if (e.key >= '1' && e.key <= '5') { // Hotbar selection 1-5
        const slotIndex = parseInt(e.key) - 1;
        if (slotIndex >= 0 && slotIndex < hotbar.length) {
            activateHotbarSlot(slotIndex);
        }
    }
  });

  // 🔁 Start the game
  applyFog(); // Initial fog application
  drawMap();
  updateHotbarUI(); // Initialize hotbar UI
  updateHealthDisplay(); // Initialize health display
};
</script>
