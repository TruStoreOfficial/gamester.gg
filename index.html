<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gamester.gg | Mighty Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Outfit:wght@300;600;900&display=swap');
        
        :root { --bg: #02040a; --accent: #00ffaa; --card: #0b0f1a; --sidebar: #06080e; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; margin: 0; overflow: hidden; }
        .logo-font { font-family: 'Unbounded', sans-serif; }

        /* UI Enhancements */
        .glass { background: rgba(6, 8, 14, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .mighty-card { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.03); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .mighty-card:hover { border-color: var(--accent); transform: translateY(-8px) scale(1.02); box-shadow: 0 10px 30px rgba(0, 255, 170, 0.1); }
        
        /* Performance Engine */
        body.low-end * { transition: none !important; backdrop-filter: none !important; box-shadow: none !important; }
        body.max-fps .fps-tag { display: block; }
        .fps-tag { display: none; position: absolute; top: 10px; right: 10px; color: var(--accent); font-size: 9px; font-weight: 900; }

        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; color: #64748b; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 255, 170, 0.1); color: var(--accent); }

        #overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
        iframe { width: 100%; height: 100%; border: none; }

        .rating-dot { width: 6px; height: 6px; border-radius: 50%; }
        .r-3 { background: #22c55e; } .r-12 { background: #eab308; } .r-15 { background: #ef4444; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="h-20 glass px-8 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg"><i class="fa fa-terminal text-black text-xl"></i></div>
            <h1 class="logo-font text-xl font-black uppercase tracking-tighter">gamester<span class="text-[#00ffaa]">.gg</span></h1>
        </div>
        <div class="flex-1 max-w-2xl mx-12 relative">
            <i class="fa fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="searchInput" placeholder="Search 400+ Eaglercraft & Games..." 
                class="w-full bg-[#0d111c] border border-white/5 rounded-2xl py-3 pl-14 pr-6 focus:border-[#00ffaa]/40 outline-none transition-all">
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleSettings()" class="w-10 h-10 rounded-full hover:bg-white/5"><i class="fa fa-cog"></i></button>
            <div class="hidden md:block text-right">
                <span id="loadCount" class="text-[#00ffaa] font-black block leading-none">0</span>
                <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Assets Live</span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-72 bg-[#06080e] border-r border-white/5 p-6 overflow-y-auto hidden lg:block">
            <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4">Core Library</p>
            <div class="space-y-1 mb-8">
                <div onclick="setTab('All')" class="nav-item active" id="tab-all"><i class="fa fa-layer-group"></i> Full Vault</div>
                <div onclick="setTab('History')" class="nav-item" id="tab-hist"><i class="fa fa-clock-rotate-left"></i> History</div>
            </div>
            <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4">Official Providers</p>
            <div class="space-y-1 mb-8">
                <div onclick="setTab('Minibox')" class="nav-item"><i class="fa fa-box-open"></i> Minibox Scratch</div>
                <div onclick="setTab('PlayLabs')" class="nav-item"><i class="fa fa-flask-vial"></i> PlayLabs</div>
                <div onclick="setTab('MiniLib')" class="nav-item"><i class="fa fa-book-atlas"></i> TruStore Mini</div>
                <div onclick="setTab('Plus')" class="nav-item font-bold"><i class="fa fa-star text-pink-500"></i> gamester+</div>
            </div>
            <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4">Applications</p>
            <div onclick="setTab('Applist')" class="nav-item"><i class="fa fa-rocket"></i> Applist</div>
        </aside>

        <main class="flex-1 overflow-y-auto p-8 bg-[#02040a]">
            <div id="grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 2xl:grid-cols-8 gap-6"></div>
        </main>
    </div>

    <div id="settings" class="hidden fixed inset-0 z-[10001] flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
        <div class="bg-[#0b0f1a] border border-white/10 w-full max-w-sm rounded-[32px] p-8 shadow-2xl">
            <h2 class="text-xl font-black mb-6 flex items-center gap-3"><i class="fa fa-sliders text-[#00ffaa]"></i> MIGHTY ENGINE</h2>
            <div class="space-y-4">
                <label class="flex items-center justify-between p-4 bg-white/5 rounded-2xl cursor-pointer hover:bg-white/10 transition-all">
                    <span>Low End Mode</span>
                    <input type="checkbox" id="lowEndToggle" onchange="updateSettings()" class="w-5 h-5 accent-[#00ffaa]">
                </label>
                <label class="flex items-center justify-between p-4 bg-white/5 rounded-2xl cursor-pointer hover:bg-white/10 transition-all">
                    <span>Show Max FPS</span>
                    <input type="checkbox" id="fpsToggle" onchange="updateSettings()" class="w-5 h-5 accent-[#00ffaa]">
                </label>
                <button onclick="clearHistory()" class="w-full p-4 text-red-400 font-bold hover:bg-red-500/10 rounded-2xl mt-4">Wipe History</button>
                <button onclick="toggleSettings()" class="w-full bg-[#00ffaa] text-black font-black py-4 rounded-2xl mt-2 uppercase tracking-widest">Apply & Close</button>
            </div>
        </div>
    </div>

    <div id="overlay">
        <div class="absolute top-6 right-6 z-[10002]">
            <button onclick="closeApp()" class="w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center hover:bg-red-500 hover:scale-110 transition-all shadow-2xl">
                <i class="fa fa-times text-xl"></i>
            </button>
        </div>
        <iframe id="frame" src=""></iframe>
    </div>

estgame3.html", "wrestlebros.html", "zombierush.html"],
            "Minibox": [], // Add filenames here
            "PlayLabs": [], 
            "MiniLib": [], 
            "Plus": [], 
            "Applist": []
        };

        let currentTab = 'All';
        let history = JSON.parse(localStorage.getItem('gs_hist')) || [];

        // Fix File Name Logic (Handles Eaglercraft Versions)
        function formatName(file) {
            // Remove the extension
            let name = file.split('.html')[0].split('.htm')[0];
            
            // If it's a version number like "1.12" or "Beta_1.3"
            if (/^\d|\d\.\d|Beta|Alpha|Indev/.test(name)) {
                return name.replace(/[_-]/g, ' ');
            }
            
            // For standard games, capitalize and space it out
            return name.replace(/[_-]/g, ' ').toUpperCase();
        }

        function getMeta(file) {
            const n = file.toLowerCase();
            let meta = { icon: 'fa-gamepad', rc: 'r-3' };
            if (n.match(/soccer|ball|basket|foot|tennis|wrestle/)) meta.icon = 'fa-basketball-ball';
            if (n.match(/car|drift|moto|bike|drive|slope|road/)) meta.icon = 'fa-car-side';
            if (n.match(/fnaf|granny|horror|backrooms/)) { meta.icon = 'fa-ghost'; meta.rc = 'r-15'; }
            if (n.match(/shooter|sniper|battle|1v1|gun/)) { meta.icon = 'fa-crosshairs'; meta.rc = 'r-12'; }
            if (n.match(/1\.|Beta|Alpha|Indev|minecraft/)) meta.icon = 'fa-cube';
            return meta;
        }

        function render() {
            const grid = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = "";
            let count = 0;

            const addCard = (file, prov) => {
                if (!file.toLowerCase().includes(search)) return;
                const meta = getMeta(file);
                const title = formatName(file);
                const card = document.createElement('div');
                card.className = "mighty-card p-6 rounded-[28px] flex flex-col items-center justify-center text-center cursor-pointer group relative";
                card.onclick = () => launch(file, prov);
                card.innerHTML = `
                    <div class="fps-tag">144 FPS</div>
                    <div class="absolute top-4 left-5 flex items-center gap-2">
                        <div class="rating-dot ${meta.rc}"></div>
                        <span class="text-[8px] font-black opacity-40 uppercase tracking-tighter">${prov}</span>
                    </div>
                    <div class="w-14 h-14 bg-black/40 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-[#00ffaa]/10 transition-all">
                        <i class="fa ${meta.icon} text-slate-600 group-hover:text-[#00ffaa]"></i>
                    </div>
                    <h3 class="text-[10px] font-black tracking-widest text-slate-400 group-hover:text-white truncate w-full">${title}</h3>
                `;
                grid.appendChild(card);
                count++;
            };

            if (currentTab === 'History') {
                history.forEach(item => addCard(item.file, item.prov));
            } else {
                Object.keys(DB).forEach(prov => {
                    if (currentTab === 'All' || currentTab === prov) {
                        DB[prov].forEach(file => addCard(file, prov));
                    }
                });
            }
            document.getElementById('loadCount').innerText = count;
        }

        // Fixed Directory Connection Logic
        function launch(file, prov) {
            let path = "";
            const base = "offline+/";
            
            if (prov === "Main") {
                path = `./offline/${file}`;
            } else {
                // Mapping folder names exactly as they are in your repo
                const map = {
                    "Minibox": "Minibox%20Scratch%20Emulator",
                    "PlayLabs": "PlayLabs",
                    "MiniLib": "TruStore%20Mini%20Lib",
                    "Plus": "gamester%2B",
                    "Applist": "Applist"
                };
                path = `./${base}${map[prov]}/${file}`;
            }

            // Update History
            history = [{file, prov}, ...history.filter(h => h.file !== file)].slice(0, 20);
            localStorage.setItem('gs_hist', JSON.stringify(history));
            
            document.getElementById('frame').src = path;
            document.getElementById('overlay').style.display = "block";
        }

        function closeApp() {
            document.getElementById('overlay').style.display = "none";
            document.getElementById('frame').src = "";
            render();
        }

        function setTab(t) {
            currentTab = t;
            document.querySelectorAll('.nav-item').forEach(i => {
                i.classList.remove('active');
                if (i.innerText.includes(t) || (t === 'All' && i.innerText.includes('Vault'))) i.classList.add('active');
            });
            render();
        }

        function toggleSettings() { document.getElementById('settings').classList.toggle('hidden'); }
        
        function updateSettings() {
            const s = { le: document.getElementById('lowEndToggle').checked, fps: document.getElementById('fpsToggle').checked };
            localStorage.setItem('gs_settings', JSON.stringify(s));
            applySettings();
        }

        function applySettings() {
            const s = JSON.parse(localStorage.getItem('gs_settings')) || {le: false, fps: false};
            document.body.classList.toggle('low-end', s.le);
            document.body.classList.toggle('max-fps', s.fps);
            document.getElementById('lowEndToggle').checked = s.le;
            document.getElementById('fpsToggle').checked = s.fps;
        }

        function clearHistory() { localStorage.removeItem('gs_hist'); history = []; render(); }

        document.getElementById('searchInput').addEventListener('input', render);
        applySettings();
        render();
    </script>
</body>
</html>
